name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build:web

      - name: Test inherited-debt ratchet
        run: bun run test:debt-ratchet

      - name: Reject new lint, type, or audit debt
        run: bun run ci:debt-ratchet

      - name: Reject case-colliding tracked paths
        run: |
          duplicates="$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            printf 'case-colliding tracked paths:\n%s\n' "$duplicates"
            exit 1
          fi

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed diff
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

      - name: Scan pull-request commits for secrets
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
