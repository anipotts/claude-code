name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build:web

      - name: Reject case-colliding tracked paths
        run: |
          duplicates="$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            printf 'case-colliding tracked paths:\n%s\n' "$duplicates"
            exit 1
          fi

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed diff
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD

      - name: Scan pull-request commits for secrets
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

